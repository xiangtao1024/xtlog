# ==================================================================
#  xtlog-server 运行配置
#
#  重要：启动脚本把本目录放到了 classpath 首位，因此本文件会【整体覆盖】
#        jar 内置的 application.properties —— 不要把里面的键删掉，
#        需要调整数值时直接改这里，保存后重启生效。
# ==================================================================

# ---------- HTTP 服务 ----------
# 服务监听端口
server.port=18080

# 请求体上限（支持 512KB / 2MB / 8MB 写法）。批量上报日志建议放宽到 8MB
server.max-body-size=8MB

# 响应 GZIP（超过 1KB 且客户端支持时压缩)
server.gzip.enabled=true
server.gzip.min-size=1024

# ---------- 前端 SPA ----------
# 无匹配路由且请求 HTML 时回退到 index.html —— 必须开启，否则 /apps、/logs 直接访问会 404
server.spa.enabled=true
server.spa.index=/static/index.html
# 不参与回退的路径前缀（逗号分隔），保持排除 /api/
server.spa.exclude-prefixes=/api/

# ---------- SSE 实时日志 ----------
# 最大并发 SSE 连接数，超限返回 503
server.sse.max-connections=200

# ---------- 线程池 ----------
# 分发线程（接收连接并路由）
server.threads.dispatch=16
# 业务线程（处理普通请求）
server.threads.biz=32
# 业务队列容量（有界队列防雪崩，超限快速失败 503）
server.threads.biz-queue=2048
# 流式线程（承载 SSE 长连接）
server.threads.stream=200
server.threads.stream-queue=4096

# 统一响应包装 {code,message,data}，前端依赖它，不要关
server.response.wrap-enabled=true
